name: PaperClaw Scheduled Pipeline

on:
  workflow_dispatch:
  schedule:
    # 03:00 Asia/Shanghai, Monday-Friday (19:00 UTC on the previous day).
    - cron: "0 19 * * 0-4"
    # Weekday retries cover arXiv publication delays; completed dates are skipped.
    - cron: "30 1,4,7 * * 1-5"

concurrency:
  group: rs-pipeline-schedule
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
      ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
      SPRINGER_NATURE_API_KEY: ${{ secrets.SPRINGER_NATURE_API_KEY }}
      RS_GITHUB_REPO: ${{ vars.RS_GITHUB_REPO }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_URL: ${{ vars.LLM_API_URL }}
      GITHUB_TIMEOUT: ${{ vars.RS_GITHUB_TIMEOUT }}
      GITHUB_RETRY: ${{ vars.RS_GITHUB_RETRY }}
      ARXIV_API_URL: ${{ vars.ARXIV_API_URL }}
      ARXIV_USER_AGENT: ${{ vars.ARXIV_USER_AGENT }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      FEISHU_TARGET: ${{ vars.FEISHU_TARGET }}
      OPENCLAW_BIN: ${{ vars.OPENCLAW_BIN }}
      RS_FILTER_KEYWORDS_FILE: scripts/config/filter_keywords.json
      RS_FILTER_PROMPT_FILE: scripts/prompts/filter_cross_prompt.md
      RS_KEEP_DOWNLOADS: "false"
      RS_MULTISOURCE_ENABLED: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            skills/rs-paper-pipeline
            papers/issue_index.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        working-directory: skills/rs-paper-pipeline
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Doctor
        working-directory: skills/rs-paper-pipeline
        run: python3 scripts/cli.py doctor

      - name: Run scheduled pipeline
        working-directory: skills/rs-paper-pipeline
        run: python3 scripts/run_remote_schedule.py

      - name: Refresh Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Print pipeline state
        if: always()
        working-directory: skills/rs-paper-pipeline
        run: |
          if ls memory/pipeline_state/*.json >/dev/null 2>&1; then
            for file in memory/pipeline_state/*.json; do
              echo "===== ${file} ====="
              cat "${file}"
            done
          else
            echo "No pipeline_state json found"
          fi

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperclaw-runtime-schedule
          path: |
            skills/rs-paper-pipeline/memory/
