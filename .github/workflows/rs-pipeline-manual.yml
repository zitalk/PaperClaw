name: PaperClaw Manual Pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        required: true
        default: "run_no_notify"
        type: choice
        options:
          - run_no_notify
          - run_notify
          - reconcile
          - paper_batch
          - doctor
      date:
        description: "Optional target date in YYYYMMDD"
        required: false
        type: string
      arxiv_ids:
        description: "Comma- or space-separated arXiv IDs for paper_batch"
        required: false
        type: string

concurrency:
  group: paperclaw-academic-api-clients
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
      ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
      SPRINGER_NATURE_API_KEY: ${{ secrets.SPRINGER_NATURE_API_KEY }}
      RS_GITHUB_REPO: ${{ vars.RS_GITHUB_REPO }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_URL: ${{ vars.LLM_API_URL }}
      GITHUB_TIMEOUT: ${{ vars.RS_GITHUB_TIMEOUT }}
      GITHUB_RETRY: ${{ vars.RS_GITHUB_RETRY }}
      ARXIV_API_URL: ${{ vars.ARXIV_API_URL }}
      ARXIV_USER_AGENT: ${{ vars.ARXIV_USER_AGENT }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      FEISHU_TARGET: ${{ vars.FEISHU_TARGET }}
      OPENCLAW_BIN: ${{ vars.OPENCLAW_BIN }}
      RS_FILTER_KEYWORDS_FILE: scripts/config/filter_keywords.json
      RS_FILTER_PROMPT_FILE: scripts/prompts/filter_cross_prompt.md
      RS_KEEP_DOWNLOADS: "false"
      RS_MULTISOURCE_ENABLED: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            skills/rs-paper-pipeline
            papers/issue_index.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        working-directory: skills/rs-paper-pipeline
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Doctor
        working-directory: skills/rs-paper-pipeline
        run: python3 scripts/cli.py doctor

      - name: Run manual command
        working-directory: skills/rs-paper-pipeline
        env:
          DISPATCH_COMMAND: ${{ github.event.inputs.command }}
          DISPATCH_DATE: ${{ github.event.inputs.date }}
          DISPATCH_ARXIV_IDS: ${{ github.event.inputs.arxiv_ids }}
        run: |
          set -euo pipefail

          case "${DISPATCH_COMMAND:-run_no_notify}" in
            doctor)
              python3 scripts/cli.py doctor
              ;;
            reconcile)
              if [[ -z "${DISPATCH_DATE:-}" ]]; then
                echo "workflow_dispatch command=reconcile requires date" >&2
                exit 1
              fi
              python3 scripts/cli.py reconcile --date "${DISPATCH_DATE}"
              ;;
            paper_batch)
              if [[ -z "${DISPATCH_ARXIV_IDS:-}" ]]; then
                echo "workflow_dispatch command=paper_batch requires arxiv_ids" >&2
                exit 1
              fi
              normalized_ids="${DISPATCH_ARXIV_IDS//,/ }"
              read -r -a paper_ids <<< "${normalized_ids}"
              for arxiv_id in "${paper_ids[@]}"; do
                if [[ ! "${arxiv_id}" =~ ^[0-9]{4}\.[0-9]{4,5}(v[0-9]+)?$ ]]; then
                  echo "invalid arXiv ID: ${arxiv_id}" >&2
                  exit 1
                fi
                python3 scripts/cli.py paper "${arxiv_id}"
              done
              python3 scripts/cli.py rebuild-index
              ;;
            run_notify)
              if [[ -n "${DISPATCH_DATE:-}" ]]; then
                python3 scripts/cli.py run --date "${DISPATCH_DATE}" --notify
              else
                python3 scripts/cli.py run --notify
              fi
              ;;
            run_no_notify)
              if [[ -n "${DISPATCH_DATE:-}" ]]; then
                python3 scripts/cli.py run --date "${DISPATCH_DATE}" --no-notify
              else
                python3 scripts/cli.py run --no-notify
              fi
              ;;
            *)
              echo "unsupported command: ${DISPATCH_COMMAND}" >&2
              exit 1
              ;;
          esac

      - name: Refresh Pages
        if: ${{ success() && github.event.inputs.command != 'doctor' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Print pipeline state
        if: always()
        working-directory: skills/rs-paper-pipeline
        run: |
          if ls memory/pipeline_state/*.json >/dev/null 2>&1; then
            for file in memory/pipeline_state/*.json; do
              echo "===== ${file} ====="
              cat "${file}"
            done
          else
            echo "No pipeline_state json found"
          fi

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperclaw-runtime-manual
          path: |
            skills/rs-paper-pipeline/memory/
